# Caché según el tipo de archivo:
#  - HTML y JS: revalidar siempre (los scripts llevan ?v=N para invalidar caché al actualizar)
#  - imágenes (sprites): 7 días
# Se usa un map para que add_header viva en un solo sitio: en nginx, un add_header
# dentro de un location anula los del server (y se perderían las cabeceras de seguridad).
map $uri $simba_cache {
    ~*\.(html|js)$                 "no-cache";
    ~*\.(png|jpg|jpeg|gif|webp)$   "public, max-age=604800";
    default                        "no-cache";
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;

    add_header Cache-Control $simba_cache always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # La raíz lleva directo al juego
    location = / {
        return 302 /game/;
    }

    location / {
        try_files $uri $uri/ =404;
    }

    # Compresión de texto (los PNG ya vienen comprimidos)
    gzip on;
    gzip_comp_level 6;
    gzip_min_length 512;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
}
